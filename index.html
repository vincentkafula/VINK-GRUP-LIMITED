<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F3D24" />
    <meta name="description" content="VINK — South Africa's first transport-native digital bank. AFC payments, banking, ride-hailing, fleet tracking and MVNO in one platform." />

    <!-- Open Graph (Facebook, LinkedIn, and used by Google for rich previews) -->
    <meta property="og:title" content="VINK Bank" />
    <meta property="og:description" content="South Africa's first transport-native digital bank. Built for 15 million daily taxi passengers." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="VINK Bank" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VINK Bank" />
    <meta name="twitter:description" content="South Africa's first transport-native digital bank." />
    <meta name="twitter:image" content="/og-image.png" />

    <title>VINK Bank</title>

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Structured data: tells Google which logo to associate with this
         organization in Search results and the Knowledge Panel. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "VINK Bank",
      "url": "https://www.vink.co.za",
      "logo": "https://www.vink.co.za/icons/icon-512x512.png",
      "sameAs": []
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
