<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf8f4" />
    <!-- Apply the saved theme before the first paint, so a dark-theme visitor never sees a white flash. -->
    <script>
      (function () {
        try {
          var c = localStorage.getItem("vink-theme");
          var dark = c === "dark" || ((c === null || c === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) { document.documentElement.classList.add("dark"); document.documentElement.style.colorScheme = "dark"; document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0c0e14"); }
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="VINK — a transport-native digital bank. AFC tap-to-pay, banking, fleet tracking and financial services in one platform for passengers, drivers, owners and investors." />

    <!-- Open Graph (Facebook, LinkedIn, and used by Google for rich previews) -->
    <meta property="og:title" content="VINK" />
    <meta property="og:description" content="A transport-native digital bank, built for the people who ride, drive and own the taxis." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="VINK" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VINK" />
    <meta name="twitter:description" content="A transport-native digital bank." />
    <meta name="twitter:image" content="/og-image.png" />

    <title>VINK</title>

    <!-- Favicons — plain ICO/PNG only. An SVG wrapping an embedded raster
         <image> was tried first but Chromium-based browsers frequently fail
         to render that pattern as a favicon (silently falling back to
         nothing/cached icon), so this sticks to formats every browser
         renders reliably. favicon.ico is also checked directly by some
         browsers regardless of <link> tags. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Structured data: tells Google which logo to associate with this
         organization in Search results and the Knowledge Panel. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "VINK",
      "url": "https://www.vink.co.za",
      "logo": "https://www.vink.co.za/icons/icon-512x512.png",
      "sameAs": []
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
